name: nexora

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${NEXORA_POSTGRES_DB:-nexora}
      POSTGRES_USER: ${NEXORA_POSTGRES_USER:-nexora}
      POSTGRES_PASSWORD: ${NEXORA_POSTGRES_PASSWORD:-nexora_dev_password}
    ports:
      - "127.0.0.1:${NEXORA_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  migrate:
    profiles: ["full"]
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    entrypoint: ["nexora-migrate"]
    command: ["-command", "up"]
    environment:
      NEXORA_ENV: development
      NEXORA_DATABASE_URL: postgres://${NEXORA_POSTGRES_USER:-nexora}:${NEXORA_POSTGRES_PASSWORD:-nexora_dev_password}@postgres:5432/${NEXORA_POSTGRES_DB:-nexora}?sslmode=disable
      NEXORA_LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy

  api:
    profiles: ["full"]
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
      args:
        VERSION: ${NEXORA_VERSION:-0.1.0}
        COMMIT: ${NEXORA_COMMIT:-local}
        BUILD_TIME: ${NEXORA_BUILD_TIME:-unknown}
    restart: unless-stopped
    environment:
      NEXORA_ENV: development
      NEXORA_HTTP_ADDR: ":8080"
      NEXORA_DATABASE_URL: postgres://${NEXORA_POSTGRES_USER:-nexora}:${NEXORA_POSTGRES_PASSWORD:-nexora_dev_password}@postgres:5432/${NEXORA_POSTGRES_DB:-nexora}?sslmode=disable
      NEXORA_LOG_LEVEL: info
      NEXORA_MIGRATE_ON_START: "false"
      NEXORA_ATTACHMENT_DIR: /app/.data/attachments
    volumes:
      - attachment_data:/app/.data/attachments
    ports:
      - "127.0.0.1:${NEXORA_API_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    profiles: ["full"]
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
      args:
        VITE_API_BASE_URL: ""
    restart: unless-stopped
    ports:
      - "127.0.0.1:${NEXORA_WEB_PORT:-3000}:8080"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  attachment_data:
