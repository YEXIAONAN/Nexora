        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/StorageUnavailable'
  /api/v1/teams/{teamID}/projects/{projectID}/tasks/{taskID}/submissions/{submissionVersionID}/attachments/{attachmentID}:
    get:
      tags:
        - Submissions
      operationId: downloadSubmissionAttachment
      summary: 经当前任务权限校验下载绑定该版本的私有附件
      description: 强制 attachment/octet-stream/nosniff；无公共存储 URL，不同版本或任务 404，缺失对象 503，归档仍可授权读取。
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/TeamID'
        - $ref: '#/components/parameters/ProjectID'
        - $ref: '#/components/parameters/TaskID'
        - $ref: '#/components/parameters/SubmissionVersionID'
        - $ref: '#/components/parameters/AttachmentID'
      responses:
        '200':
          description: 操作成功
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Content-Disposition:
              schema:
                type: string
              description: 安全编码的 attachment 文件名
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/StorageUnavailable'
  /api/v1/teams/{teamID}/projects/{projectID}/reviewers:
