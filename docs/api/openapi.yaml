openapi: 3.1.0
info:
  title: Nexora API
  version: 0.1.0
  description: |
    Nexora V1.0 的 HTTP 接口契约。

    Phase 04 增加不可变成果版本、明确审核授权、正式验收和私有附件。
    成果提交与正式完成分离；通用状态接口不能代替当前版本的正式审核。

    约定：
    - 所有时间均为 UTC，使用 RFC 3339 表示。
    - 成功响应使用 {"data": ...} 包装。
    - 失败响应使用 {"error": {...}} 包装，并携带 request_id。
    - 每个响应都包含 X-Request-Id 头。
    - /api/v1 下的变更请求（POST/PUT/PATCH/DELETE）必须携带 X-Nexora-CSRF: 1 头。
    - 认证使用 HttpOnly 会话 Cookie（nexora_session），不使用 Authorization 头。
servers:
  - url: http://127.0.0.1:8080
    description: 本地开发
tags:
  - name: System
    description: 进程、依赖与实例信息
  - name: Auth
    description: 认证、会话与当前用户
  - name: Admin
    description: 平台管理（ROOT 与平台管理员）
  - name: Teams
    description: 团队、成员角色与受控邀请（Team 内权限独立于平台角色）
  - name: Submissions
    description: 成果版本、正式审核、明确授权与私有附件
  - name: Projects
    description: 项目、成员、里程碑、归档与交接
  - name: Tasks
    description: 授权任务树、依赖、执行进度与历史
paths:
  /healthz:
    get:
      tags: [System]
      operationId: getLiveness
      summary: 进程存活检查
      description: 仅确认 HTTP 进程可以响应，不访问数据库。
      responses:
        '200':
          description: 进程存活
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Liveness'
  /readyz:
    get:
      tags: [System]
      operationId: getReadiness
      summary: 依赖就绪检查
      description: 检查 PostgreSQL 连接与已应用的 Schema 版本。任一检查失败时返回 503。
      responses:
        '200':
          description: 实例可以接收业务流量
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
        '503':
          description: 数据库不可达或 Schema 尚未迁移
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
  /api/v1/meta:
    get:
      tags: [System]
      operationId: getMeta
      summary: 实例元数据
      description: 返回构建信息、运行环境和安装实例 ID。安装实例 ID 来自 PostgreSQL 的 system_settings 表。
      responses:
        '200':
          description: 实例元数据
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetaEnvelope'
        '500':
          description: 未预期的服务端错误
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: 登录并建立服务端会话
      description: |
        校验用户名与密码，成功后通过 Set-Cookie 下发 HttpOnly 会话令牌（仅存 SHA-256 摘要于服务端）。
        每次登录签发全新令牌（防会话固定）。失败按 IP+用户名限流；未知用户与错误密码返回相同的 401。
      parameters:
        - $ref: '#/components/parameters/CSRFHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功，Set-Cookie 携带会话令牌
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Set-Cookie:
              description: nexora_session=...; Path=/; HttpOnly; SameSite=Lax（生产追加 Secure）
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/auth/me:
    get:
      tags: [Auth]
      operationId: getCurrentUser
      summary: 当前登录用户信息
      security:
        - sessionCookie: []
      responses:
        '200':
          description: 当前用户
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/auth/session:
    delete:
      tags: [Auth]
      operationId: logout
      summary: 退出登录并撤销当前会话
      description: 服务端撤销会话并清除 Cookie；被撤销的令牌立即失效。
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CSRFHeader'
      responses:
        '200':
          description: 会话已撤销
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevokedEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/admin/users:
    post:
      tags: [Admin]
      operationId: createUser
      summary: 创建普通账号（ROOT 或平台管理员）
      description: 受控账号创建通道；不存在公众注册接口。新账号 system_root 恒为 false。
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CSRFHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: 账号已创建
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/admin/users/{userID}/sessions:
    delete:
      tags: [Admin]
      operationId: revokeUserSessions
      summary: 撤销指定用户的全部会话（ROOT 或平台管理员）
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/UserID'
        - $ref: '#/components/parameters/CSRFHeader'
      responses:
        '200':
          description: 撤销的会话数量
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevokedSessionsEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/admin/platform-roles:
    post:
      tags: [Admin]
      operationId: grantPlatformRole
      summary: 授予平台管理员角色（仅 ROOT）
      description: ROOT 身份本身不可被授予平台角色（409）。团队角色不等于平台角色。
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CSRFHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrantPlatformRoleRequest'
      responses:
        '201':
          description: 角色已授予
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformRoleEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/admin/platform-roles/{userID}:
    delete:
      tags: [Admin]
      operationId: revokePlatformRole
      summary: 撤销平台管理员角色（仅 ROOT）
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/UserID'
        - $ref: '#/components/parameters/CSRFHeader'
      responses:
        '200':
          description: 角色已撤销
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevokedEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/teams:
    get:
      tags: [Teams]
      operationId: listMyTeams
      summary: 我加入的团队列表
      description: 仅返回当前用户具有 active 成员关系的团队，并附带本人在每个团队中的角色。
      security:
        - sessionCookie: []
      responses:
        '200':
          description: 我的团队
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamsEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Teams]
      operationId: createTeam
      summary: 创建团队
      description: 任何已认证用户可创建团队；创建者自动成为该团队 owner。团队角色不等于平台角色。
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CSRFHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTeamRequest'
      responses:
        '201':
          description: 团队已创建
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/teams/{teamID}:
    get:
      tags: [Teams]
      operationId: getTeam
      summary: 团队详情
      description: 仅 active 成员可见；非成员（含 ROOT）一律 404，不泄露团队是否存在。
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/TeamID'
      responses:
        '200':
          description: 团队详情（含本人角色）
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/teams/{teamID}/permissions:
    get:
      tags: [Teams]
      operationId: getTeamPermissions
      summary: 我在该团队的能力视图
      description: 由本人成员角色按权限矩阵推导；前端据此渲染管理入口，后端仍逐请求强制校验。
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/TeamID'
      responses:
        '200':
          description: 能力视图
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamPermissionsEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/teams/{teamID}/members:
    get:
      tags: [Teams]
      operationId: listTeamMembers
      summary: 团队成员列表
      description: 所有 active 成员可见，仅返回 active 成员。
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/TeamID'
      responses:
        '200':
          description: 成员列表
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamMembersEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/teams/{teamID}/members/{userID}:
    patch:
      tags: [Teams]
      operationId: changeMemberRole
      summary: 变更成员角色
      description: |
        owner 可授予任意团队角色；admin 只能在 admin/member 之间调整且不能触碰 owner；
        member 无角色管理权限。数据库触发器保证至少保留一名 active owner（409）。
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/TeamID'
        - $ref: '#/components/parameters/UserID'
        - $ref: '#/components/parameters/CSRFHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeMemberRoleRequest'
      responses:
        '200':
          description: 角色已变更
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleChangedEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Teams]
      operationId: removeMember
      summary: 移除成员或自行退出
      description: |
        owner/admin 可移除成员（admin 不能移除 owner）；任何成员可移除自己（退出）。
        最后一名 active owner 不能被移除或降级（409）。移除立即生效。
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/TeamID'
        - $ref: '#/components/parameters/UserID'
        - $ref: '#/components/parameters/CSRFHeader'
      responses:
        '200':
          description: 成员已移除
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemovedEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/teams/{teamID}/invitations:
    post:
      tags: [Teams]
      operationId: createInvitation
      summary: 邀请已有账号加入团队
      description: |
        仅 owner/admin 可邀请；只能邀请已存在的账号，角色限 admin/member。
        默认有效期 72 小时（1–168 小时）。同一团队同一用户至多一条 pending 邀请（409）；
        已是 active 成员时拒绝（409）。
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/TeamID'
        - $ref: '#/components/parameters/CSRFHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInvitationRequest'
      responses:
        '201':
          description: 邀请已创建
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamInvitationEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [Teams]
      operationId: listTeamInvitations
      summary: 团队邀请记录
      description: 仅 owner/admin 可见，包含全部状态的邀请历史。
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/TeamID'
      responses:
        '200':
          description: 邀请列表
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamInvitationsEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/teams/{teamID}/invitations/{invitationID}:
    delete:
      tags: [Teams]
      operationId: cancelInvitation
      summary: 取消 pending 邀请
      description: 仅 owner/admin 可取消；邀请必须属于路径中的团队，跨团队引用返回 404。
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/TeamID'
        - $ref: '#/components/parameters/InvitationID'
        - $ref: '#/components/parameters/CSRFHeader'
      responses:
        '200':
          description: 邀请已取消
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevokedEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/invitations:
    get:
      tags: [Teams]
      operationId: listMyInvitations
      summary: 我收到的有效邀请
      description: 仅返回发给当前账号、仍 pending 且未过期的邀请。
      security:
        - sessionCookie: []
      responses:
        '200':
          description: 邀请列表
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamInvitationsEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/invitations/{invitationID}/accept:
    post:
      tags: [Teams]
      operationId: acceptInvitation
      summary: 接受邀请
      description: |
        仅被邀请账号本人可接受；其他用户一律 404。过期或已处理的邀请返回 409。
        接受后按邀请角色建立（或重新激活）成员关系，且只写入邀请所属团队。
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/InvitationID'
        - $ref: '#/components/parameters/CSRFHeader'
      responses:
        '200':
          description: 已加入团队
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamInvitationEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/invitations/{invitationID}/decline:
    post:
      tags: [Teams]
      operationId: declineInvitation
      summary: 拒绝邀请
