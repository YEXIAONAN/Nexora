      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrantReviewerRequest'
  /api/v1/teams/{teamID}/projects/{projectID}/reviewers/{userID}:
    delete:
      tags:
        - Submissions
      operationId: revokeProjectReviewer
      summary: lead 撤销审核权限，实时生效并审计
      description: 有效 Team/Project/Task 授权，跨上下文 404，归档只读；当前版本与 expected_version 共同校验。
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/TeamID'
        - $ref: '#/components/parameters/ProjectID'
        - $ref: '#/components/parameters/UserID'
        - $ref: '#/components/parameters/CSRFHeader'
      responses:
        '200':
          description: 操作成功
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectReviewersEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/StorageUnavailable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevokeReviewerRequest'
  /api/v1/teams/{teamID}/reviews/pending:
    get:
      tags:
        - Submissions
      operationId: listMyPendingReviews
      summary: 待我审核：只返回当前可审且非本人提交的当前版本
      description: 有效 Team/Project/Task 授权，跨上下文 404，归档只读；当前版本与 expected_version 共同校验。
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/TeamID'
      responses:
        '200':
          description: 操作成功
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingReviewsEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/StorageUnavailable'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: nexora_session
      description: 服务端会话令牌（HttpOnly Cookie）；数据库仅存 SHA-256 摘要。
  parameters:
    CSRFHeader:
      name: X-Nexora-CSRF
      in: header
      required: true
      description: 变更请求必须携带值 1；缺失时返回 403。
      schema:
        type: string
        enum: ['1']
    UserID:
      name: userID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TeamID:
      name: teamID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InvitationID:
      name: invitationID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    "ProjectID":
      "name": "projectID"
      "in": "path"
      "required": true
      "schema":
        "type": "string"
        "format": "uuid"
    "TaskID":
      "name": "taskID"
      "in": "path"
      "required": true
      "schema":
        "type": "string"
        "format": "uuid"
    "MilestoneID":
      "name": "milestoneID"
      "in": "path"
      "required": true
      "schema":
        "type": "string"
        "format": "uuid"
    "DependencyID":
      "name": "dependencyID"
      "in": "path"
      "required": true
      "schema":
        "type": "string"
        "format": "uuid"
    SubmissionVersionID:
      name: submissionVersionID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AttachmentID:
      name: attachmentID
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: 请求体或路径参数非法
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthorized:
      description: 未认证、会话无效或凭据错误
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: 已认证但操作权限不足，或缺少 CSRF 头
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: 资源不存在
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: 状态冲突（重复用户名、重复授权、ROOT 已初始化等）
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ValidationFailed:
      description: 字段级校验失败
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    RateLimited:
      description: 登录失败次数超过限流阈值
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    InternalError:
      description: 未预期的服务端错误
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    StorageUnavailable:
      description: 私有存储暂时不可用，业务历史保留
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  headers:
    RequestId:
      description: 请求关联 ID，与错误响应体中的 request_id 一致。
      schema:
        type: string
  schemas:
    Liveness:
      type: object
      additionalProperties: false
      required: [status, checked_at]
      properties:
        status:
          type: string
          enum: [ok]
        checked_at:
          type: string
          format: date-time
    CheckResult:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [up, down]
        detail:
          type: string
          description: 面向操作者的简短说明，不包含连接串或凭据。
    Readiness:
      type: object
      additionalProperties: false
      required: [status, checks, checked_at]
      properties:
        status:
          type: string
          enum: [ready, unavailable]
        checks:
          type: object
          additionalProperties: false
          required: [database, schema]
          properties:
            database:
              $ref: '#/components/schemas/CheckResult'
            schema:
              $ref: '#/components/schemas/CheckResult'
        checked_at:
          type: string
          format: date-time
    Meta:
      type: object
      additionalProperties: false
      required:
        [name, version, commit, build_time, environment, instance_id, root_initialized, server_time]
      properties:
        name:
          type: string
          example: Nexora
        version:
          type: string
          example: 0.1.0
        commit:
          type: string
          description: 构建使用的 Git 提交 SHA，未注入时为 none。
          example: 4f3c2b1
        build_time:
          type: string
          description: 构建时间（RFC 3339），未注入时为 unknown。
          example: '2026-10-29T12:00:00Z'
        environment:
          type: string
          enum: [development, test, production]
        instance_id:
          type: [string, 'null']
          description: 安装实例 ID；基线迁移未执行时为 null。
        root_initialized:
          type: [boolean, 'null']
          description: 是否已完成 ROOT 引导；身份表不可用时为 null。
        server_time:
          type: string
          format: date-time
    MetaEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Meta'
    Error:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          example: not_found
        message:
          type: string
        fields:
          type: object
          additionalProperties:
            type: string
        request_id:
          type: string
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/Error'
    User:
      type: object
      additionalProperties: false
      required: [id, username, display_name, system_root, platform_admin]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        display_name:
          type: string
        system_root:
          type: boolean
          description: 不可变 ROOT 标记；仅由引导命令设置。
        platform_admin:
          type: boolean
          description: 是否持有 platform_admin 平台角色；ROOT 不依赖此角色。
    UserEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/User'
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
    LoginEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [user, expires_at]
          properties:
            user:
              $ref: '#/components/schemas/User'
            expires_at:
              type: string
              format: date-time
    CreateUserRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          description: 3-32 位小写字母、数字、下划线或连字符；服务端统一小写。
        display_name:
          type: string
          description: 可选，最长 64 字符。
        password:
          type: string
          format: password
          description: 10-128 字节，不得与用户名相同。
    GrantPlatformRoleRequest:
      type: object
      additionalProperties: false
      required: [user_id]
      properties:
        user_id:
          type: string
          format: uuid
    PlatformRoleEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [user_id, role]
          properties:
            user_id:
              type: string
              format: uuid
            role:
              type: string
              enum: [platform_admin]
    RevokedEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [revoked]
          properties:
            revoked:
              type: boolean
    RevokedSessionsEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [revoked_sessions]
          properties:
            revoked_sessions:
              type: integer
              format: int64
    Team:
      type: object
      additionalProperties: false
      required: [id, name, description, created_by, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: 1-64 个字符（按 Unicode 字符计）。
        description:
          type: string
          description: 最长 500 个字符。
        created_by:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        my_role:
          type: string
          enum: [owner, admin, member]
          description: 当前用户在该团队中的角色；“我的团队”列表与创建团队的响应均返回（创建者恒为 owner）。
    TeamEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Team'
    TeamsEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Team'
    TeamMember:
      type: object
      additionalProperties: false
      required: [user_id, username, display_name, role, joined_at]
      properties:
        user_id:
          type: string
          format: uuid
        username:
          type: string
        display_name:
          type: string
        role:
          type: string
          enum: [owner, admin, member]
        joined_at:
          type: string
          format: date-time
    TeamMembersEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/TeamMember'
    TeamPermissions:
      type: object
      additionalProperties: false
      required:
        [team_id, role, can_invite, can_manage_invitations, can_remove_members, can_change_roles, can_leave]
      properties:
        team_id:
          type: string
          format: uuid
        role:
          type: string
          enum: [owner, admin, member]
        can_invite:
          type: boolean
        can_manage_invitations:
          type: boolean
        can_remove_members:
          type: boolean
          description: 管理性移除权限；任何成员均可通过 can_leave 自行退出。
        can_change_roles:
          type: boolean
        can_leave:
          type: boolean
    TeamPermissionsEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/TeamPermissions'
    TeamInvitation:
      type: object
      additionalProperties: false
      required:
        [id, team_id, invited_user_id, invited_username, invited_by, role, status, expires_at, created_at]
      properties:
        id:
          type: string
          format: uuid
        team_id:
          type: string
          format: uuid
        team_name:
          type: string
          description: 列表视图附带团队名；创建响应中省略。
        invited_user_id:
          type: string
          format: uuid
        invited_username:
          type: string
        invited_by:
          type: string
          format: uuid
        role:
          type: string
          enum: [admin, member]
        status:
          type: string
          enum: [pending, accepted, declined, cancelled]
        expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
    TeamInvitationEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/TeamInvitation'
    TeamInvitationsEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/TeamInvitation'
    CreateTeamRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          description: 1-64 个字符。
        description:
          type: string
          description: 可选，最长 500 个字符。
    CreateInvitationRequest:
      type: object
      additionalProperties: false
      required: [username, role]
      properties:
        username:
          type: string
          description: 已存在账号的用户名；不存在公开注册。
        role:
          type: string
          enum: [admin, member]
        expires_in_hours:
          type: integer
          description: 可选，1-168；省略时为 72。
    ChangeMemberRoleRequest:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role:
          type: string
          enum: [owner, admin, member]
    RoleChangedEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [user_id, team_id, role]
          properties:
            user_id:
              type: string
              format: uuid
            team_id:
              type: string
              format: uuid
            role:
              type: string
              enum: [owner, admin, member]
