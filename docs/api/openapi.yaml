      operationId: uploadSubmissionAttachment
      summary: 私有附件暂存与幂等重试
      description: 仅有提交权限的未阻塞执行/驳回叶子。单文件10MiB；5个/版本、25MiB/版本、512MiB/Team；暂存24h。类型/内容/路径校验，失败补偿与定期清理。
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/TeamID'
        - $ref: '#/components/parameters/ProjectID'
        - $ref: '#/components/parameters/TaskID'
        - $ref: '#/components/parameters/CSRFHeader'
        - name: X-Nexora-Upload-Id
          in: header
          required: true
          schema:
            type: string
            format: uuid
          description: 客户端本次文件请求的 UUID；相同文件重试复用，服务端存储键仍随机生成。
      responses:
        '201':
          description: 操作成功
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachmentEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
